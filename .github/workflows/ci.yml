name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  security-properties:
    name: Build the stack and prove the three properties
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # The scripted stub, so CI never depends on a model being available or on
      # a model making the same choice twice.
      MODEL_BACKEND: replay
      # The property under test in beat 2. Stated explicitly so a change to the
      # compose default cannot silently turn the test into a skip.
      VALIDATE_TOKEN_RESOURCE: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r tests/requirements.txt

      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Service state
        run: docker compose ps

      - name: Run the security property tests
        run: pytest -q tests/

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail=300

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
